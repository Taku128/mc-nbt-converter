name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # runner の CMake 4 は cmake_minimum_required が 3.5 より古い CMakeLists を断る。
  # leveldb-zlib (mcworld・mcworld-browser の依存) の leveldb-mcpe がそうなので、
  # pnpm install でのビルドが止まる。古い指定を 3.5 として扱わせる
  CMAKE_POLICY_VERSION_MINIMUM: '3.5'

jobs:
  mappings-sync:
    name: Verify shared mappings are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Check mapping files
        run: node tools/sync-mappings/sync.mjs --check

  test-js:
    name: Test JS (coverage)
    runs-on: ubuntu-latest
    needs: mappings-sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node tools/sync-mappings/sync.mjs
      - run: pnpm run build
      - run: node packages/js/all/test/mapping-coverage.test.mjs
      # core の mapBlock ユニットテスト + mcworld-browser の LevelDB リーダテスト
      # + mcworld (Node) の防御パステスト (不正キーガード・tmpdir 後始末)
      # + mcstructure の版 1 / 版 2 (統合版 26.50〜) と zlib の圧縮 (統合版 26.60〜) の読み取り
      - run: node --test test/*.test.mjs
        working-directory: packages/js/core
      - run: node --test test/*.test.mjs
        working-directory: packages/js/mcworld-browser
      - run: node --test test/*.test.mjs
        working-directory: packages/js/mcworld
      - run: node --test test/*.test.mjs
        working-directory: packages/js/mcstructure

  golden:
    name: JS/Go golden (semantic)
    runs-on: ubuntu-latest
    needs: mappings-sync
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - run: pnpm install --frozen-lockfile
      - run: node tools/sync-mappings/sync.mjs
      - run: pnpm run build
      # JS と Go の変換出力を deepslate でパースして意味論比較する
      - run: node tests/golden/run.mjs

  test-go:
    name: Test Go (coverage)
    runs-on: ubuntu-latest
    needs: mappings-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.24' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node tools/sync-mappings/sync.mjs
      - run: go test ./...
        working-directory: packages/go
